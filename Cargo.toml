[workspace]
resolver = "2"
members = [
    "crates/uw-core",
    "crates/uw-adapters",
    "crates/uw-policy",
    "crates/uw-store",
    "crates/uw-daemon",
    "crates/uw-cli",
    "crates/uw-web",
    "crates/uw-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mikenrafter/usagewindow"

[workspace.dependencies]
uw-core = { path = "crates/uw-core" }
uw-adapters = { path = "crates/uw-adapters" }
uw-policy = { path = "crates/uw-policy" }
uw-store = { path = "crates/uw-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
