[workspace]
resolver = "3"
members = [
    "crates/uw-core",
    "crates/uw-adapters",
    "crates/uw-policy",
    "crates/uw-store",
    "crates/uw-daemon",
    "crates/uw-cli",
    "crates/uw-web",
    "crates/uw-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mikenrafter/usagewindow"

[workspace.dependencies]
uw-core = { path = "crates/uw-core" }
uw-adapters = { path = "crates/uw-adapters" }
uw-policy = { path = "crates/uw-policy" }
uw-store = { path = "crates/uw-store" }
uw-daemon = { path = "crates/uw-daemon" }
uw-web = { path = "crates/uw-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "process", "io-std"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rust-embed = "8"
tower = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
