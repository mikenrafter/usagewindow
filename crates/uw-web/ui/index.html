<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usagewindow</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e6e8ee;
    --muted: #8b90a0; --accent: #5b8cff; --danger: #ff5b6e; --ok: #4cd77b;
    --warn: #f5b642; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.2rem; background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
  header button:hover { border-color: var(--accent); }
  #banner { display: none; background: rgba(255,91,110,0.12); border-bottom: 1px solid var(--danger); color: var(--danger); padding: 0.5rem 1.2rem; font-size: 0.85rem; }
  #banner.show { display: block; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.4fr); gap: 1rem; padding: 1rem; align-items: start; }
  .full { grid-column: 1 / -1; }
  section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 0.7rem; }
  .panelhead { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8rem; }
  .panelhead h2 { margin: 0 0 0.7rem; }
  .panelhead #usagemeta { font-size: 0.78rem; margin-bottom: 0.7rem; text-transform: none; letter-spacing: normal; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  input, select, textarea { background: #0d0f14; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 6px; font: inherit; }
  input[type=text], input[type=search] { flex: 1; min-width: 120px; }
  label.chk { display: flex; align-items: center; gap: 0.3rem; color: var(--muted); font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(91,140,255,0.08); }
  tbody tr.selected { background: rgba(91,140,255,0.16); }
  .pill { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px; font-size: 0.72rem; border: 1px solid var(--border); color: var(--muted); }
  .pill.stopped { color: var(--danger); border-color: var(--danger); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.pending { color: var(--warn); border-color: var(--warn); }
  .pill.keepalive { color: var(--accent); border-color: var(--accent); }
  .pill.cached { color: var(--ok); border-color: var(--ok); }
  .pill.uncached { color: var(--muted); border-color: var(--border); }
  .pill.inline { color: var(--ok); border-color: var(--ok); }
  .pill.external { color: var(--warn); border-color: var(--warn); }
  .muted { color: var(--muted); }
  .kv { display: grid; grid-template-columns: 11rem 1fr; gap: 0.35rem 0.8rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .kv .k { color: var(--muted); }
  .kv .v { word-break: break-word; }
  .btnrow { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.6rem 0; }
  button.action { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
  button.action:hover { border-color: var(--accent); }
  button.action.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.action.primary { border-color: var(--accent); color: var(--accent); }
  form.edit { display: grid; gap: 0.5rem; margin: 0.6rem 0 1rem; padding: 0.8rem; border: 1px dashed var(--border); border-radius: 6px; }
  form.edit .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .turn { border-left: 3px solid var(--border); padding: 0.4rem 0 0.4rem 0.6rem; margin-bottom: 0.5rem; white-space: pre-wrap; }
  .turn.user { border-color: var(--accent); }
  .turn.assistant { border-color: var(--ok); }
  .turn .role { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.2rem; }
  .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }
  .err { color: var(--danger); font-size: 0.85rem; margin: 0.4rem 0; }
  pre.raw { background: #0d0f14; border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; margin: 0.4rem 0; }
  .pager { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.7rem; font-size: 0.82rem; color: var(--muted); }
  .pager button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.25rem 0.6rem; border-radius: 6px; cursor: pointer; }
  .pager button:disabled { opacity: 0.4; cursor: default; }

  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
  .card { background: #0d0f14; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; }
  .card .head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
  .card .prov { font-weight: 600; }
  .acct { color: var(--muted); font-size: 0.8rem; filter: blur(5px); transition: filter 0.15s; cursor: pointer; user-select: none; }
  .acct.revealed { filter: none; }
  .card .stale { margin-left: auto; }
  .barrow { margin-bottom: 0.7rem; }
  .barrow:last-child { margin-bottom: 0; }
  .barrow .title { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.25rem; }
  .barrow .label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem; }
  .barrow .label .pct-val { text-align: left; font-size: 0.95rem; font-weight: 600; color: var(--text); }
  .barrow .label .burn-val { text-align: right; font-size: 0.78rem; color: var(--muted); }
  .barrow .label .burn-val b { color: var(--text); font-weight: 600; }
  .barrow .label .burnlabel { color: var(--muted); margin-right: 0.2rem; }
  .bar { position: relative; height: 10px; border-radius: 5px; background: #1c2028; overflow: hidden; }
  .bar .fill { position: absolute; inset: 0; width: 0; border-radius: 5px 0 0 5px; background: var(--ok); transition: width 0.3s; }
  .bar .fill.warn { background: var(--warn); }
  .bar .fill.danger { background: var(--danger); }
  .bar .burnmark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
  .barrow .meta { display: flex; gap: 0.8rem; font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; flex-wrap: wrap; }
  .barrow .meta b { color: var(--text); }

  .actionrow { border-bottom: 1px solid var(--border); padding: 0.5rem 0; font-size: 0.82rem; }
  .actionrow:last-child { border-bottom: none; }
  .actionrow .top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem; flex-wrap: wrap; }
  .actionrow .sid { font-weight: 600; }
  .actionrow .meta { color: var(--muted); font-size: 0.78rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .actionrow { cursor: pointer; }
  .actionrow:hover { background: rgba(91,140,255,0.08); }
  .action-error { color: var(--danger); margin-top: 0.35rem; font-size: 0.78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .errorbox { border: 1px solid var(--danger); border-radius: 6px; background: rgba(255,91,110,0.08); padding: 0.65rem 0.8rem; margin: 0 0 1rem; }
  .errorbox h3 { color: var(--danger); font-size: 0.78rem; margin: 0 0 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .errorbox ul { margin: 0; padding-left: 1.1rem; color: var(--danger); font-size: 0.82rem; }
  .actions-panel {
    background: #0d0f14; border: 1px solid var(--border); border-radius: 8px;
    grid-column: 1 / -1; max-height: 60vh; overflow-y: auto; min-width: 0;
  }
  .actions-panel > .panelhead {
    position: sticky; top: 0; z-index: 1;
    background: #0d0f14; padding: 0.8rem 0.8rem 0.5rem;
    border-bottom: 1px solid var(--border); margin: 0;
  }
  .actions-panel > .panelhead h2 { margin: 0; }
  .actions-panel > .panelhead .muted { margin: 0; }
  .actions-panel #actions { padding: 0 0.8rem 0.8rem; }
  #login { display: none; position: fixed; inset: 0; z-index: 20; place-items: center; background: rgba(15,17,21,0.92); }
  #login.show { display: grid; }
  #login form { width: min(22rem, calc(100vw - 2rem)); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  #login h2 { margin-bottom: 0.8rem; }
  #login input { width: 100%; margin-bottom: 0.6rem; }

  /* Mobile: everything above this point assumes a wide screen (sessions list
     next to detail, usage cards next to actions, a 6-column table). Below the
     breakpoint, stack sections sequentially and turn the sessions table into
     a label/value card list so text stops wrapping onto itself. */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    header { padding: 0.6rem 0.8rem; gap: 0.6rem; }
    header h1 { font-size: 1rem; }
    header button { padding: 0.35rem 0.65rem; }
    main { grid-template-columns: 1fr; padding: 0.6rem; gap: 0.8rem; }
    .usage-layout { grid-template-columns: 1fr; }
    .cardgrid { grid-template-columns: 1fr; }

    /* Text inputs/selects don't shrink below their intrinsic min-content width
       in a flex/grid row, so a search box next to a dropdown (or two side-by-side
       form fields) overflows the viewport on narrow screens instead of wrapping.
       Stack them instead of trying to fit two on one line. */
    .row { flex-direction: column; align-items: stretch; }
    form.edit .row2 { grid-template-columns: 1fr; }

    /* iOS Safari zooms the whole page in on focus when a form control's
       font-size is under 16px; keep controls at 16px here so focusing the
       search box or a select doesn't yank the viewport around. */
    input, select, textarea { font-size: 16px; }

    .kv { grid-template-columns: 1fr; gap: 0.1rem 0; }
    .kv .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .kv .v { margin-bottom: 0.5rem; }

    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tbody tr { border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.6rem; margin-bottom: 0.6rem; }
    tbody tr:hover { background: none; }
    tbody td { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; border-bottom: none; padding: 0.3rem 0; min-width: 0; text-align: right; overflow-wrap: anywhere; }
    tbody td::before { content: attr(data-label); flex: 0 0 auto; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; text-align: left; }
    tbody td:last-child { flex-wrap: wrap; justify-content: flex-start; text-align: left; }
    tbody td[colspan] { display: block; text-align: left; }
    tbody td[colspan]::before { content: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Usagewindow v__UW_VERSION__</h1>
  <div class="spacer"></div>
  <button id="refresh">Refresh</button>
</header>
<div id="banner"></div>
<div id="login">
  <form id="login-form">
    <h2>Authentication required</h2>
    <input name="password" type="password" autocomplete="current-password" placeholder="password" required autofocus>
    <div id="login-error" class="err"></div>
    <button class="action primary" type="submit">Sign in</button>
  </form>
</div>
<main>
  <section class="panel full">
    <div class="panelhead">
      <h2>Usage</h2>
      <span id="usagemeta" class="muted"></span>
    </div>
    <div id="usagecards" class="cardgrid"><p class="empty">loading…</p></div>
  </section>

  <section class="panel actions-panel">
    <div class="panelhead"><h2>Recent actions</h2><span class="muted" style="font-size:.78rem">latest 20</span></div>
    <div id="actions"><p class="empty">loading…</p></div>
  </section>

  <section class="panel">
    <h2>Sessions</h2>
    <div class="row">
      <input id="q" type="search" placeholder="search id / cwd / model…">
      <select id="harness">
        <option value="">any harness</option>
        <option value="Codex">Codex</option>
        <option value="ClaudeCode">Claude</option>
        <option value="Cursor">Cursor</option>
      </select>
      <label class="chk"><input type="checkbox" id="inactive"> include inactive sessions</label>
    </div>
    <div id="err" class="err"></div>
    <table>
      <thead><tr><th>id</th><th>harness</th><th>model</th><th>account</th><th>last seen</th><th>status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">loading…</td></tr></tbody>
    </table>
    <div class="pager">
      <button id="pg-prev">&laquo; prev</button>
      <span id="pg-label">page 1</span>
      <button id="pg-next">next &raquo;</button>
    </div>
    <details style="margin-top:1.2rem">
      <summary>New session</summary>
      <form id="create" class="edit">
        <div class="row2">
          <input name="id" placeholder="session id" required>
          <select name="harness"><option>Codex</option><option>ClaudeCode</option><option>Cursor</option></select>
        </div>
        <input name="cwd" placeholder="cwd" required>
        <input name="model" placeholder="model (optional)">
        <div class="btnrow"><button class="action primary" type="submit">Create</button></div>
      </form>
    </details>
  </section>

  <section class="panel">
    <h2>Detail</h2>
    <div id="detail"><p class="empty">Select a session on the left.</p></div>
  </section>

</main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

let selectedId = null;
let lastStatus = null;
let lastStatusOkAt = null;
let sessionsById = new Map();
let page = 0;
const PAGE_SIZE = 15;
let totalSessions = 0;

async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (res.status === 401 && path !== '/api/auth/login') showLogin();
  if (!res.ok) throw new Error(typeof body === 'string' ? body : (text || res.statusText));
  return body;
}

function showLogin() {
  $('#login').classList.add('show');
  $('#login-form input').focus();
}

function hideLogin() {
  $('#login').classList.remove('show');
  $('#login-error').textContent = '';
}

function fmtDate(s) {
  if (!s) return '-';
  try { return new Date(s).toLocaleString(); } catch { return s; }
}

function fmtDuration(ms) {
  if (ms == null) return null;
  const past = ms < 0;
  ms = Math.abs(ms);
  const totalMin = Math.round(ms / 60000);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  const parts = [];
  if (d) parts.push(d + 'd');
  if (h || d) parts.push(h + 'h');
  parts.push(m + 'm');
  return (past ? '-' : '') + parts.join(' ');
}

function countdown(iso) {
  if (!iso) return '-';
  const target = new Date(iso).getTime();
  if (Number.isNaN(target)) return '-';
  const delta = target - Date.now();
  return delta <= 0 ? 'now' : fmtDuration(delta);
}

function pillFor(session) {
  const pills = [];
  pills.push(`<span class="pill ${session.active ? 'ok' : 'stopped'}">${session.active ? 'active' : 'inactive'}</span>`);
  pills.push(`<span class="pill ${session.cached ? 'cached' : 'uncached'}">${session.cached ? 'cached' : 'uncached'}</span>`);
  if (session.stopped_reason) pills.push('<span class="pill stopped">stopped</span>');
  if (session.resume_status) {
    pills.push(`<span class="pill pending">resume-${escapeHtml(statusName(session.resume_status))}</span>`);
  }
  if (session.compaction_status) {
    const status = statusName(session.compaction_status);
    const cls = status === 'failed' ? 'stopped' : 'pending';
    const label = status === 'pending' ? 'queued' : status;
    pills.push(`<span class="pill ${cls}">compaction-${label}</span>`);
  }
  return pills.join(' ');
}

function statusName(status) {
  if (typeof status === 'string') return status.toLowerCase();
  if (status && typeof status === 'object') return Object.keys(status)[0].toLowerCase();
  return String(status).toLowerCase();
}

function renderCompactionLog(list) {
  if (!list.length) return '<p class="empty">no compaction requests</p>';
  return [...list].reverse().map(r => {
    const status = statusName(r.status);
    const cls = status === 'failed' ? 'stopped' : status === 'sent' ? 'ok' : 'pending';
    const failMsg = r.status && typeof r.status === 'object' ? r.status.Failed : null;
    return `
      <div class="actionrow">
        <div class="top">
          <span class="pill">${escapeHtml(r.kind)}</span>
          <span class="pill ${cls}">${escapeHtml(status)}</span>
          <span class="muted">${fmtDate(r.created_at)}</span>
        </div>
        <div class="meta"><span>${escapeHtml(r.reason)}</span><span>${escapeHtml(r.prompt)}</span></div>
        ${failMsg ? `<div class="action-error">${escapeHtml(failMsg)}</div>` : ''}
      </div>`;
  }).join('');
}

function escapeHtml(v) {
  if (v == null) return '-';
  const s = typeof v === 'string' ? v : JSON.stringify(v);
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.addEventListener('click', event => {
  const account = event.target.closest('.acct');
  if (account) account.classList.toggle('revealed');
});

function providerLabel(p) {
  if (typeof p === 'string') return ({ ClaudeCode: 'Claude', Codex: 'Codex', Cursor: 'Cursor' })[p] || p;
  if (p && p.Other) return p.Other;
  return escapeHtml(p);
}

function windowLabel(w) {
  if (typeof w === 'string') return w;
  if (w.Rolling) {
    const mins = w.Rolling.minutes;
    if (mins < 60) return `${mins}m window`;
    const hours = mins / 60;
    if (hours < 24) return `${hours}h window`;
    const days = hours / 24;
    return days === 7 ? 'Weekly window' : `${days}d window`;
  }
  if (w.WeeklyModel) return `Weekly · ${w.WeeklyModel}`;
  if (w.WeeklySurface) return `Weekly · ${w.WeeklySurface}`;
  if (w.Custom) return w.Custom;
  return escapeHtml(w);
}

// Rolling windows first (shortest to longest), then weekly/custom kinds,
// alphabetically — so card layout doesn't jump around between refreshes.
function windowSortKey(w) {
  if (w.Rolling) return [0, w.Rolling.minutes, ''];
  if (w.WeeklyModel) return [1, 0, w.WeeklyModel];
  if (w.WeeklySurface) return [1, 0, w.WeeklySurface];
  if (w.Custom) return [2, 0, w.Custom];
  return [3, 0, String(w)];
}
function sortWindows(windows) {
  return [...windows].sort((a, b) => {
    const ka = windowSortKey(a.window), kb = windowSortKey(b.window);
    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2].localeCompare(kb[2]);
  });
}

function severityClass(pct) {
  if (pct >= 90) return 'danger';
  if (pct >= 70) return 'warn';
  return '';
}

function setBanner(msg) {
  const b = $('#banner');
  if (!msg) { b.classList.remove('show'); b.textContent = ''; return; }
  b.classList.add('show');
  b.textContent = msg;
}

function renderUsage(status) {
  const box = $('#usagecards');
  if (!status || !status.usage.length) {
    box.innerHTML = '<p class="empty">no usage recorded yet</p>';
    return;
  }
  const statusByKey = new Map((status.provider_status || []).map(s => [providerLabel(s.provider) + '|' + (s.account || ''), s]));
  box.innerHTML = status.usage.map(u => {
    const key = providerLabel(u.provider) + '|' + (u.account || '');
    const fs = statusByKey.get(key);
    const staleBadge = fs && fs.last_error
      ? `<span class="pill stopped stale" title="${escapeHtml(fs.last_error)}">refresh failing (${fs.consecutive_failures}×) · last ok ${fs.last_success_at ? fmtDate(fs.last_success_at) : 'never'}</span>`
      : '';
    const bars = sortWindows(u.windows).map(w => {
      const pct = Math.min(100, Math.max(0, w.pct));
      const sev = severityClass(pct);
      const burnWindowMinutes = u.provider === 'Cursor' ? 1440 : 30;
      const burn = w.burn_rate_pct_per_hour != null ? (w.burn_rate_pct_per_hour * burnWindowMinutes / 60) : null;
      const burnPos = burn != null ? Math.min(100, pct + burn) : null;
      const burnPct = burn != null ? (burn >= 0 ? '+' : '') + burn.toFixed(1) + '%' : '-';
      const sessions = `${w.active_sessions} session${w.active_sessions === 1 ? '' : 's'}`;
      return `
        <div class="barrow">
          <div class="title">${escapeHtml(windowLabel(w.window))}${w.exceeded ? ' · exceeded' : ''}</div>
          <div class="label">
            <span class="pct-val">${pct.toFixed(1)}%</span>
            <span class="burn-val"><span class="burnlabel">burn/${burnWindowMinutes === 1440 ? '24h' : '30m'}</span> ${sessions} @ <b>${burnPct}</b></span>
          </div>
          <div class="bar">
            <div class="fill ${sev}" style="width:${pct}%"></div>
            ${burnPos != null ? `<div class="burnmark" style="left:${burnPos}%" title="projected in ${burnWindowMinutes === 1440 ? '24h' : '30m'}"></div>` : ''}
          </div>
          <div class="meta">
            <span>resets in <b>${countdown(w.resets_at)}</b></span>
            <span>depletes in <b>${w.depletes_at ? countdown(w.depletes_at) : '-'}</b></span>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <div class="head">
          <span class="prov">${escapeHtml(providerLabel(u.provider))}</span>
          <span class="acct" title="click to reveal">${escapeHtml(u.account || 'default account')}</span>
          ${staleBadge}
        </div>
        ${bars}
      </div>`;
  }).join('');
}

async function loadStatus() {
  try {
    const status = await api('/api/status');
    lastStatus = status;
    lastStatusOkAt = Date.now();
    setBanner(null);
    $('#usagemeta').textContent = `refreshed ${fmtDate(status.last_updated)} · ${status.keepalive_active_count} keepalive'd`;
    renderUsage(status);
  } catch (e) {
    setBanner(`Failed to refresh from server: ${e.message}${lastStatusOkAt ? ' — showing data as of ' + fmtDate(new Date(lastStatusOkAt).toISOString()) : ''}`);
    // Deliberately leave lastStatus/#usagecards/#usagemeta untouched: a failed
    // poll must not blank out the last known-good numbers.
  }
}

async function loadActions() {
  const box = $('#actions');
  try {
    const events = await api('/api/actions/recent?limit=20');
    if (!events.length) { box.innerHTML = '<p class="empty">no recent actions</p>'; return; }
    box.innerHTML = events.map(e => {
      return `
        <div class="actionrow" data-id="${escapeHtml(e.session_id)}">
          <div class="top">
            <span class="sid">${escapeHtml(e.session_id)}</span>
            <span class="pill">${escapeHtml(e.kind)}</span>
            <span class="pill ${e.status === 'failed' ? 'stopped' : e.status === 'active' || e.status === 'successful' || e.status === 'resumed' ? 'ok' : 'pending'}">${escapeHtml(e.status)}</span>
          </div>
          <div class="meta">
            ${e.detail ? `<span>${escapeHtml(e.detail)}</span>` : ''}
            <span>${fmtDate(e.at)}</span>
          </div>
          ${e.error ? `<div class="action-error">${escapeHtml(e.error)}</div>` : ''}
        </div>`;
    }).join('');
    $$('#actions .actionrow').forEach(row => row.addEventListener('click', () => selectSession(row.dataset.id)));
  } catch (e) {
    // Same rule as loadStatus: a failed poll keeps whatever was last rendered.
  }
}

async function loadSessions() {
  $('#err').textContent = '';
  const params = new URLSearchParams();
  const q = $('#q').value.trim();
  const harness = $('#harness').value;
  if (q) params.set('q', q);
  if (harness) params.set('harness', harness);
  if ($('#inactive').checked) params.set('inactive', 'true');
  params.set('offset', String(page * PAGE_SIZE));
  params.set('limit', String(PAGE_SIZE));
  let result;
  try {
    result = await api('/api/sessions?' + params.toString());
  } catch (e) {
    $('#err').textContent = 'Failed to load sessions: ' + e.message;
    return;
  }
  const items = result.items;
  totalSessions = result.total;
  sessionsById = new Map(items.map(s => [s.id, s]));
  const rows = $('#rows');
  if (!items.length) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">no sessions match</td></tr>';
  } else {
    rows.innerHTML = items.map(s => `
      <tr data-id="${escapeHtml(s.id)}" class="${s.id === selectedId ? 'selected' : ''}">
        <td data-label="id">${escapeHtml(s.id)}</td>
        <td data-label="harness">${escapeHtml(providerLabel(s.harness))}</td>
        <td data-label="model">${escapeHtml(s.model || '-')}</td>
        <td data-label="account" class="muted acct">${escapeHtml(s.account || '-')}</td>
        <td data-label="last seen">${fmtDate(s.last_seen)}</td>
        <td data-label="status">${pillFor(s)}${s.keepalive ? ' <span class="pill keepalive">keepalive</span>' : ''}</td>
      </tr>`).join('');
    $$('#rows tr').forEach(tr => tr.addEventListener('click', () => selectSession(tr.dataset.id)));
  }
  const pages = Math.max(1, Math.ceil(totalSessions / PAGE_SIZE));
  $('#pg-label').textContent = `page ${page + 1} of ${pages} (${totalSessions} sessions)`;
  $('#pg-prev').disabled = page <= 0;
  $('#pg-next').disabled = page + 1 >= pages;
}

async function selectSession(id) {
  selectedId = id;
  $$('#rows tr').forEach(tr => tr.classList.toggle('selected', tr.dataset.id === id));
  const detail = $('#detail');
  detail.innerHTML = '<p class="empty">loading…</p>';
  let d;
  try {
    d = await api('/api/sessions/' + encodeURIComponent(id));
  } catch (e) {
    detail.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
    return;
  }
  const s = d.summary;
  const marker = d.resume_controls.marker;
  const listItem = sessionsById.get(id);
  const keptAlive = listItem ? listItem.keepalive : false;
  detail.innerHTML = `
    ${d.errors.length ? `<div class="errorbox"><h3>Errors</h3><ul>${d.errors.map(error => `<li>${escapeHtml(error)}</li>`).join('')}</ul></div>` : ''}
    <div class="kv">
      <div class="k">id</div><div class="v">${escapeHtml(s.id)}</div>
      <div class="k">harness</div><div class="v">${escapeHtml(providerLabel(s.harness))}</div>
      <div class="k">model</div><div class="v">${escapeHtml(s.model)}</div>
      <div class="k">account</div><div class="v acct">${escapeHtml(s.account)}</div>
      <div class="k">cwd</div><div class="v">${escapeHtml(s.cwd)}</div>
      <div class="k">state path</div><div class="v">${escapeHtml(s.state_path)}</div>
      <div class="k">first seen</div><div class="v">${fmtDate(s.first_seen)}</div>
      <div class="k">last seen</div><div class="v">${fmtDate(s.last_seen)}</div>
      <div class="k">context window</div><div class="v">${escapeHtml(s.context_window_size)}</div>
      <div class="k">last token count</div><div class="v">${escapeHtml(s.last_known_token_count)}</div>
      <div class="k">pid</div><div class="v">${escapeHtml(s.pid)}</div>
      <div class="k">stopped reason</div><div class="v">${escapeHtml(s.stopped_reason)}</div>
      <div class="k">keepalive</div><div class="v">${keptAlive ? '<span class="pill keepalive">on</span>' : '<span class="muted">off</span>'}</div>
      <div class="k">resume marker</div><div class="v">${marker
        ? `${escapeHtml(marker.status)} · reason ${escapeHtml(marker.reason)} · resume_at ${fmtDate(marker.resume_at)}${marker.requested_at ? ' · requested_at ' + fmtDate(marker.requested_at) : ''}${marker.message ? '<br><span class="muted">' + escapeHtml(marker.message) + '</span>' : ''}`
        : '<span class="muted">none</span>'}</div>
    </div>

    <div class="btnrow">
      <button class="action primary" id="btn-resume">Queue resume</button>
      ${marker ? '<button class="action" id="btn-cancel-resume">Cancel resume</button>' : ''}
      <button class="action" id="btn-keepalive">${keptAlive ? 'Disable' : 'Enable'} keepalive</button>
      <button class="action" id="btn-compact">Request compaction</button>
      <button class="action" id="btn-edit-toggle">Edit</button>
      <button class="action" id="btn-preview">Load transcript preview</button>
      <button class="action danger" id="btn-delete">Delete session</button>
    </div>

    <form id="edit-form" class="edit" style="display:none">
      <input name="cwd" value="${escapeHtml(s.cwd) === '-' ? '' : escapeHtml(s.cwd)}" placeholder="cwd" required>
      <div class="row2">
        <input name="model" value="${s.model || ''}" placeholder="model">
        <input name="account" value="${s.account || ''}" placeholder="account">
      </div>
      <div class="btnrow"><button class="action primary" type="submit">Save</button></div>
    </form>

    <form id="resume-form" class="edit" style="display:none">
      <input name="at" type="datetime-local" placeholder="resume no earlier than (optional)">
      <textarea name="message" placeholder="resume message" rows="2"></textarea>
      <div class="btnrow"><button class="action primary" type="submit">Send</button></div>
    </form>

    <form id="compact-form" class="edit" style="display:none">
      <input name="reason" placeholder="reason / extra instructions after /compact (optional)">
      <div class="btnrow"><button class="action primary" type="submit">Send</button></div>
    </form>

    <div id="preview"></div>

    <details>
      <summary>raw usage history (${d.history.length} points)</summary>
      <pre class="raw">${escapeHtml(d.history.slice(-20))}</pre>
    </details>

    <h2 style="margin-top:1rem">Compaction requests (${d.compaction_log.length})</h2>
    <div id="compaction-log">${renderCompactionLog(d.compaction_log)}</div>
  `;

  $('#btn-edit-toggle').addEventListener('click', () => {
    const f = $('#edit-form');
    f.style.display = f.style.display === 'none' ? 'grid' : 'none';
  });
  $('#edit-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api('/api/sessions/' + encodeURIComponent(id), {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          cwd: fd.get('cwd'),
          model: fd.get('model') || null,
          account: fd.get('account') || null,
        }),
      });
      await loadSessions();
      await selectSession(id);
    } catch (err) { alert('Update failed: ' + err.message); }
  });

  $('#btn-resume').addEventListener('click', () => {
    const f = $('#resume-form');
    f.style.display = f.style.display === 'none' ? 'grid' : 'none';
  });
  $('#resume-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const at = fd.get('at') ? new Date(fd.get('at')).toISOString() : null;
    try {
      await api('/api/sessions/' + encodeURIComponent(id) + '/resume', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: id, at, message: fd.get('message') || null }),
      });
      await selectSession(id);
    } catch (err) { alert('Resume failed: ' + err.message); }
  });

  const cancelBtn = $('#btn-cancel-resume');
  if (cancelBtn) cancelBtn.addEventListener('click', async () => {
    try {
      await api('/api/sessions/' + encodeURIComponent(id) + '/resume/cancel', { method: 'POST' });
      await selectSession(id);
    } catch (err) { alert('Cancel failed: ' + err.message); }
  });

  $('#btn-compact').addEventListener('click', () => {
    const f = $('#compact-form');
    f.style.display = f.style.display === 'none' ? 'grid' : 'none';
  });
  $('#compact-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api('/api/sessions/' + encodeURIComponent(id) + '/compact/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: id, reason: fd.get('reason') || null }),
      });
      await selectSession(id);
    } catch (err) { alert('Compaction request failed: ' + err.message); }
  });

  $('#btn-keepalive').addEventListener('click', async () => {
    try {
      await api('/api/sessions/' + encodeURIComponent(id) + '/keepalive', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ enabled: !keptAlive }),
      });
      await loadSessions();
      await selectSession(id);
    } catch (err) { alert('Keepalive toggle failed: ' + err.message); }
  });

  $('#btn-delete').addEventListener('click', async () => {
    if (!confirm(`Delete session ${id}? This removes its resume/compaction history too.`)) return;
    try {
      await api('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
      selectedId = null;
      $('#detail').innerHTML = '<p class="empty">Select a session on the left.</p>';
      await loadSessions();
    } catch (err) { alert('Delete failed: ' + err.message); }
  });

  $('#btn-preview').addEventListener('click', async () => {
    const box = $('#preview');
    box.innerHTML = '<p class="empty">loading…</p>';
    try {
      const turns = await api('/api/sessions/' + encodeURIComponent(id) + '/preview');
      box.innerHTML = turns.length
        ? turns.map(t => `<div class="turn ${t.role.toLowerCase()}"><div class="role">${escapeHtml(t.role)}</div>${escapeHtml(t.text)}</div>`).join('')
        : '<p class="empty">no turns found</p>';
    } catch (err) {
      box.innerHTML = `<p class="empty">no transcript preview available (${escapeHtml(err.message)})</p>`;
    }
  });
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const password = new FormData(e.target).get('password');
  try {
    await api('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    e.target.reset();
    hideLogin();
    loadStatus();
    loadSessions();
    loadActions();
  } catch (err) {
    $('#login-error').textContent = err.message;
  }
});

$('#create').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await api('/api/sessions', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        id: fd.get('id'),
        harness: fd.get('harness'),
        cwd: fd.get('cwd'),
        model: fd.get('model') || null,
      }),
    });
    e.target.reset();
    page = 0;
    await loadSessions();
  } catch (err) { alert('Create failed: ' + err.message); }
});

$('#refresh').addEventListener('click', () => { loadStatus(); loadSessions(); loadActions(); });
$('#q').addEventListener('input', debounce(() => { page = 0; loadSessions(); }, 250));
$('#harness').addEventListener('change', () => { page = 0; loadSessions(); });
$('#inactive').addEventListener('change', () => { page = 0; loadSessions(); });
$('#pg-prev').addEventListener('click', () => { if (page > 0) { page--; loadSessions(); } });
$('#pg-next').addEventListener('click', () => { page++; loadSessions(); });

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function bootstrap() {
  try {
    const auth = await api('/api/auth/status');
    if (auth.enabled && !auth.authenticated) { showLogin(); return; }
    loadStatus();
    loadSessions();
    loadActions();
  } catch (e) {
    setBanner(`Failed to initialize: ${e.message}`);
  }
}
bootstrap();
setInterval(loadStatus, 15000);
setInterval(loadActions, 30000);
</script>
</body>
</html>
